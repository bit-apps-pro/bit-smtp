name: bit-smtp-test

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp_test_db
    command: --max_allowed_packet=256M
    tmpfs:
      - /var/lib/mysql          # ephemeral: test DB never persists, no DROP-TABLES risk to real data
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.20
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025"             # web UI + REST API (integration tests assert delivery here)
      - "1025:1025"             # SMTP endpoint SmtpTransport sends to
