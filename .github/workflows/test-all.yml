name: Run Lefthook on Push

on:
  push:
    branches:
      - 'main'
      - 'feature/*'
      - 'feat/*'
      - 'fix/*'
  pull_request:
    branches:
      - 'feat/*'
      - 'feature/*'

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.x'
          tools: composer:v2, wp-cli

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        name: Restore package cache
        id: restore-package-cache
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.dir }}
            ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-cached-test-package-${{ hashFiles('**/pnpm-lock.yaml', '**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-cached-test-package-

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress
          pnpm install

      - uses: actions/cache/save@v4
        name: Save package cache
        if: always() && steps.restore-package-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.restore-package-cache.outputs.cache-primary-key }}
          path: |
            ${{ steps.pnpm-cache.outputs.dir }}
            ${{ steps.composer-cache.outputs.dir }}

      - name: Run Lefthook
        run: pnpm lefthook run github-actions

  php-matrix:
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.compute.outputs.php }}
      min: ${{ steps.compute.outputs.min }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Compute PHP matrix from "Requires PHP" floor up to latest stable
        id: compute
        shell: bash
        run: |
          # Floor is the plugin's declared minimum in the bit_smtp.php "Requires PHP" header (currently 8.1).
          floor="$(grep -ioP 'Requires PHP:\s*\K[0-9]+\.[0-9]+' bit_smtp.php | head -n1)"
          if [ -z "$floor" ]; then echo "Could not parse 'Requires PHP' from bit_smtp.php" >&2; exit 1; fi
          # Maintained list of stable PHP releases up to today's latest; starting at 8.1 also drops the legacy 8.0 leg.
          all=(8.1 8.2 8.3 8.4)
          selected=()
          for v in "${all[@]}"; do
            # keep v when floor <= v (version-sorted), i.e. floor is the smaller of the pair
            if [ "$(printf '%s\n' "$floor" "$v" | sort -V | head -n1)" = "$floor" ]; then selected+=("$v"); fi
          done
          json="$(printf '%s\n' "${selected[@]}" | jq -R . | jq -cs .)"
          echo "php=$json" >> "$GITHUB_OUTPUT"
          echo "min=$floor" >> "$GITHUB_OUTPUT"
          echo "PHP matrix: $json (floor $floor)"

  php-tests:
    needs: [php-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.php-matrix.outputs.php) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      # phpunit 12 requires PHP >= 8.3; legs below that install with the platform check ignored and skip test:unit/analyse.
      - name: Install deps (ignore platform on legs < 8.3)
        run: composer install --prefer-dist --no-progress ${{ fromJSON(matrix.php) < 8.3 && '--ignore-platform-req=php' || '' }}
      - name: Gate smoke (all versions)
        run: php tests/gate/gate-smoke.php
      - name: Bootstrap-chain compat (minimum supported version leg)
        if: matrix.php == needs.php-matrix.outputs.min
        run: composer compat:gate
      - name: Backend compat (all legs, >= 8.1)
        run: composer compat
      - name: Full PHP unit suite incl. golden (>= 8.3)
        if: ${{ fromJSON(matrix.php) >= 8.3 }}
        run: composer test:unit
      - name: PHPStan (>= 8.3)
        if: ${{ fromJSON(matrix.php) >= 8.3 }}
        run: composer analyse
